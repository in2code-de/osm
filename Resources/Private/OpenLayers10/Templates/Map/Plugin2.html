<f:layout name="Default" />


<f:section name="main">
    <f:if condition="!{configurationExists}">
        <f:render section="errorNoTypoScript" arguments="{_all}"/>
    </f:if>
    <f:if condition="{settings.addresses}">
        <f:then>
            <f:render partial="Map/Map" arguments="{_all}"/>
        </f:then>
        <f:else>
            <f:render partial="errorNoAddresses" arguments="{_all}"/>
        </f:else>
    </f:if>
</f:section>


<f:section name="errorNoAddresses">
    <div class="alert alert-warning" role="alert">
        <h4 class="alert-heading">No addresses given</h4>
        <p>Please select some tt_address records with filled latitude and longitude fields!</p>
    </div>
</f:section>


<f:section name="errorNoTypoScript">
    <div class="alert alert-warning" role="alert">
        <h4 class="alert-heading">Configuration is missing</h4>
        <p>Maybe TypoScript was not added in static templates section?</p>
    </div>
</f:section>
